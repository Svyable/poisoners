name: Verify research observatory

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate initial data, sources and site
        run: node scripts/verify.cjs
      - name: Verify generated research artifacts
        run: node scripts/build-foundation.cjs --check
      - name: Run evidence-integrity, metric-model and privacy tests
        run: node --test scripts/foundation.test.cjs
      - name: Check paid-versus-obligated monetary outcomes and inflation methodology
        run: node --test scripts/damages.test.cjs
      - name: Validate chemical-specific releases, speciation and non-scoring guardrails
        run: |
          node --check docs/chemistry.js
          node --test scripts/chemistry.test.cjs
      - name: Verify EPA TRI Form R facility importer and provenance safeguards
        run: |
          node --check scripts/import-tri-basic.cjs
          node --check docs/tri-facility-ui.js
          node --test scripts/tri-import.test.cjs
          node --test scripts/tri-primary-source.test.cjs
      - name: Verify source-bounded stack rankings and advanced multi-metric filters
        run: node --test scripts/rank.test.cjs
      - name: Check 2024 AEP original chemical values, media and non-ranking safeguards
        run: |
          node --check docs/operator-benchmark.js
          node --test scripts/operator-benchmark.test.cjs
      - name: Validate EPA chemical concentration standards and no cross-media safety scoring
        run: |
          node --check docs/exposure-benchmarks.js
          node --test scripts/exposure-benchmarks.test.cjs
      - name: Validate people provenance and individual-liability safeguards
        run: node --test scripts/people.test.cjs
      - name: Check research explorer JavaScript syntax
        run: |
          node --check docs/foundation-app.js
          node --check docs/dossier-lab.js
          node --check docs/rank-model.js
          node --check docs/rank-app.js
          node --check docs/dossier-register-data.js
          node --check src/dossier-model.cjs
          node --check docs/people-app.js
          node --check docs/people-register-data.js
          node --check src/people-model.cjs
      - name: Verify public health source briefs and static HTML
        run: node scripts/build-awareness.cjs --check
      - name: Test source-bound research workbench and client syntax
        run: |
          node --check docs/workbench-model.js
          node --check docs/workbench-app.js
          node --test scripts/workbench.test.cjs
      - name: Audit official environmental data portals
        run: node scripts/check-public-records.cjs
      - name: Validate local site links and document anchors
        run: node scripts/check-site-links.cjs
      - name: Verify knowledge field notes, original sources and static HTML
        run: |
          node --check scripts/build-knowledge.cjs
          node --check docs/knowledge-app.js
          node scripts/build-knowledge.cjs --check
          node --test scripts/knowledge.test.cjs
      - name: Verify chemical evidence crosswalk and generated pathway HTML
        run: |
          node --check docs/pathways-app.js
          node scripts/build-pathways.cjs --check
          node --test scripts/pathways.test.cjs
      - name: Verify global search lifecycle and cross-app state contracts
        run: |
          node --check docs/site.js
          node --check docs/site-search.js
          node --check docs/rank-app.js
          node --check docs/workbench-app.js
          node --check scripts/state-machine.cjs
          node --test scripts/site-search.test.cjs
          node --test scripts/state-machines.test.cjs
          node --test scripts/interaction-states.test.cjs
          node scripts/build-search-index.cjs --check
      - name: Audit public HTML accessibility and local research navigation
        run: node scripts/check-public-site.cjs
      - name: Audit source catalog structure offline
        run: node scripts/audit-sources.cjs --report /tmp/poison-source-catalog.json
