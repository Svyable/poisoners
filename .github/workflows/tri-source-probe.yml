# TEMPORARY source-acquisition probe for an independently reviewed 2024 TRI identity.
# This workflow is removed after publication; regular CI remains read-only.
name: Verify EPA 2024 Form R source acquisition
on:
  push:
    branches: [feat/real-tri-form-r-source-proof]
    paths:
      - .github/workflows/tri-source-probe.yml
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download original EPA 2024 Texas TRI Basic CSV
        run: |
          mkdir -p /tmp/poisoners-epa
          curl --fail --location --show-error --retry 3 --connect-timeout 25 --max-time 240 \
            'https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/2024_TX/csv' \
            --output /tmp/poisoners-epa/2024_TX.csv
          test "$(wc -c </tmp/poisoners-epa/2024_TX.csv)" -gt 25000
          sha256sum /tmp/poisoners-epa/2024_TX.csv
          head -n 1 /tmp/poisoners-epa/2024_TX.csv | cut -c 1-15000
          echo 'APPROVED FACILITY TRIFD ROW COUNT:'
          grep -c '77522XXNCH5000B' /tmp/poisoners-epa/2024_TX.csv || true
      - name: Import approved source-backed facility Form R rows
        run: |
          node scripts/import-tri-basic.cjs \
            --input /tmp/poisoners-epa/2024_TX.csv \
            --retrieved "$(date -u +%F)" \
            --expected-sha256 8863d7ae9639e4773fdc0f4fe5702e0a7e50307068fbbcbc4f5e80bb180bb30d \
            --source-url 'https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/2024_TX/csv' \
            --output docs/tri-facility-releases.json
          node -e "const x=require('./docs/tri-facility-releases.json');if(x.records.length<1||x.issues.length)throw Error('No validated approved facility records or unresolved provenance issues');console.log('Facility records:',x.records.length,'SHA:',x.source.source_file_sha256)"
      - name: Validate source-backed records and browser explorer
        run: |
          node --check docs/tri-facility-ui.js
          node --test scripts/tri-import.test.cjs
          node --test scripts/rank.test.cjs
          node scripts/check-site-links.cjs
      - name: Commit and push reviewed-source import candidate to this branch
        run: |
          git config user.name 'POISONERS Source CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/tri-facility-releases.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: stage EPA 2024 Texas facility Form R source-checked release rows'
          git push origin HEAD:feat/real-tri-form-r-source-proof
